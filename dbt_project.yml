name: 'popsql_test'
version: '1.0.0'
config-version: 2

# PopSQL generates this profile from the target configured in its settings.
profile: 'default'

model-paths: ['models']
analysis-paths: ['analysis']
test-paths: ['tests']
seed-paths: ['seeds']
macro-paths: ['macros']
snapshot-paths: ['snapshots']

target-path: 'target'
clean-targets:
  - 'target'
  - 'dbt_modules'
  - 'dbt_packages'

models:
  popsql_test:
    +materialized: view
